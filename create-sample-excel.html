<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Sample Excel - Eratronics Selectit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h4>Create Sample Excel File</h4>
                    </div>
                    <div class="card-body">
                        <p>Click the button below to create a sample Excel file with the correct format for testing the upload functionality.</p>
                        <button class="btn btn-primary" onclick="createSampleExcel()">Create Sample Excel File</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script>
        function createSampleExcel() {
            try {
                // Create sample data
                const sampleData = [
                    { username: 'testuser1', password: 'password123', user_type: 'admin' },
                    { username: 'testuser2', password: 'password456', user_type: 'a' },
                    { username: 'testuser3', password: 'password789', user_type: 'b' },
                    { username: 'testuser4', password: 'password012', user_type: 'c' }
                ];

                // Create workbook
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(sampleData);
                XLSX.utils.book_append_sheet(wb, ws, 'Users');

                // Generate and download file
                XLSX.writeFile(wb, 'sample_users.xlsx');
                alert('Sample Excel file created and downloaded as "sample_users.xlsx"');
            } catch (error) {
                alert('Error creating sample file: ' + error.message);
            }
        }
    </script>
</body>
</html>
