<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Test - Eratronics Selectit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4>Database Connection Test</h4>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <button class="btn btn-primary" onclick="testConnection()">Test Database Connection</button>
                        </div>
                        <div class="mb-3">
                            <button class="btn btn-success" onclick="initDatabase()">Initialize Database</button>
                        </div>
                        <div class="mb-3">
                            <button class="btn btn-info" onclick="testData()">Test Data Endpoint</button>
                        </div>
                        <div id="results" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showResult(message, type = 'info') {
            const results = document.getElementById('results');
            const alertClass = type === 'error' ? 'alert-danger' : type === 'success' ? 'alert-success' : 'alert-info';
            results.innerHTML = `
                <div class="alert ${alertClass}">
                    <strong>${new Date().toLocaleTimeString()}:</strong> ${message}
                </div>
            `;
        }

        async function testConnection() {
            showResult('Testing database connection...', 'info');
            try {
                const response = await fetch('/api/test-neon');
                const data = await response.json();
                if (data.success) {
                    showResult(`✅ Database connection successful!<br>PostgreSQL Version: ${data.data.postgresVersion}<br>Current Time: ${data.data.currentTime}`, 'success');
                } else {
                    showResult(`❌ Database connection failed: ${data.message}`, 'error');
                }
            } catch (error) {
                showResult(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function initDatabase() {
            showResult('Initializing database...', 'info');
            try {
                const response = await fetch('/api/init-db', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                if (data.success) {
                    showResult(`✅ Database initialized successfully!<br>${data.message}`, 'success');
                } else {
                    showResult(`❌ Database initialization failed: ${data.message}`, 'error');
                }
            } catch (error) {
                showResult(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function testData() {
            showResult('Testing data endpoint...', 'info');
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                if (data.users && data.images && data.clicks) {
                    showResult(`✅ Data endpoint working!<br>Users: ${data.users.length}<br>Images: ${data.images.length}<br>Clicks: ${data.clicks.length}`, 'success');
                } else {
                    showResult(`❌ Data endpoint returned unexpected format`, 'error');
                }
            } catch (error) {
                showResult(`❌ Error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
