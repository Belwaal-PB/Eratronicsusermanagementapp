<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Upload Test - Eratronics Selectit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4><i class="bi bi-file-earmark-excel text-success me-2"></i>Excel Upload Test</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <strong>Test Excel Upload Functionality</strong><br>
                            This page will help debug Excel upload issues.
                        </div>
                        
                        <div class="mb-4">
                            <h5>1. Test XLSX Library Loading</h5>
                            <button class="btn btn-primary" onclick="testXLSXLibrary()">Test XLSX Library</button>
                            <div id="xlsxTestResult" class="mt-2"></div>
                        </div>

                        <div class="mb-4">
                            <h5>2. Test File Reading</h5>
                            <input type="file" id="testFileInput" class="form-control mb-2" accept=".xlsx,.xls">
                            <button class="btn btn-success" onclick="testFileReading()">Test File Reading</button>
                            <div id="fileTestResult" class="mt-2"></div>
                        </div>

                        <div class="mb-4">
                            <h5>3. Test API Connection</h5>
                            <button class="btn btn-info" onclick="testAPIConnection()">Test API Connection</button>
                            <div id="apiTestResult" class="mt-2"></div>
                        </div>

                        <div class="mb-4">
                            <h5>4. Test Complete Upload Process</h5>
                            <input type="file" id="uploadFileInput" class="form-control mb-2" accept=".xlsx,.xls">
                            <button class="btn btn-warning" onclick="testCompleteUpload()">Test Complete Upload</button>
                            <div id="uploadTestResult" class="mt-2"></div>
                        </div>

                        <div class="mb-4">
                            <h5>5. Create Sample Excel File</h5>
                            <button class="btn btn-secondary" onclick="createSampleExcel()">Create Sample Excel File</button>
                            <div id="sampleResult" class="mt-2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script>
        function showResult(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const alertClass = type === 'error' ? 'alert-danger' : type === 'success' ? 'alert-success' : 'alert-info';
            element.innerHTML = `
                <div class="alert ${alertClass}">
                    <strong>${new Date().toLocaleTimeString()}:</strong> ${message}
                </div>
            `;
        }

        function testXLSXLibrary() {
            try {
                if (typeof XLSX !== 'undefined') {
                    showResult('xlsxTestResult', '✅ XLSX library loaded successfully! Version: ' + XLSX.version, 'success');
                } else {
                    showResult('xlsxTestResult', '❌ XLSX library not loaded', 'error');
                }
            } catch (error) {
                showResult('xlsxTestResult', '❌ Error: ' + error.message, 'error');
            }
        }

        function testFileReading() {
            const fileInput = document.getElementById('testFileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                showResult('fileTestResult', '❌ Please select a file first', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);
                    
                    showResult('fileTestResult', 
                        `✅ File read successfully!<br>
                         Sheets: ${workbook.SheetNames.join(', ')}<br>
                         Rows: ${jsonData.length}<br>
                         Columns: ${jsonData.length > 0 ? Object.keys(jsonData[0]).join(', ') : 'None'}<br>
                         Sample data: ${JSON.stringify(jsonData.slice(0, 2), null, 2)}`, 
                        'success');
                } catch (error) {
                    showResult('fileTestResult', '❌ Error reading file: ' + error.message, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function testAPIConnection() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                if (data.users !== undefined) {
                    showResult('apiTestResult', '✅ API connection successful! Data structure looks good.', 'success');
                } else {
                    showResult('apiTestResult', '❌ API returned unexpected data structure', 'error');
                }
            } catch (error) {
                showResult('apiTestResult', '❌ API connection failed: ' + error.message, 'error');
            }
        }

        async function testCompleteUpload() {
            const fileInput = document.getElementById('uploadFileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                showResult('uploadTestResult', '❌ Please select a file first', 'error');
                return;
            }

            try {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[sheetName];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet);

                        if (jsonData.length === 0) {
                            showResult('uploadTestResult', '❌ No data found in Excel file', 'error');
                            return;
                        }

                        // Check required columns
                        const requiredColumns = ['username', 'password', 'user_type'];
                        const missingColumns = requiredColumns.filter(col => !jsonData[0].hasOwnProperty(col));
                        
                        if (missingColumns.length > 0) {
                            showResult('uploadTestResult', `❌ Missing required columns: ${missingColumns.join(', ')}`, 'error');
                            return;
                        }

                        // Process and validate data
                        const users = [];
                        const errors = [];

                        jsonData.forEach((row, index) => {
                            try {
                                const username = String(row.username).trim();
                                const password = String(row.password).trim();
                                const userType = String(row.user_type).trim().toLowerCase();

                                if (!username || !password) {
                                    errors.push(`Row ${index + 2}: Username and password cannot be empty`);
                                    return;
                                }

                                if (!['admin', 'a', 'b', 'c'].includes(userType)) {
                                    errors.push(`Row ${index + 2}: Invalid user_type '${userType}'. Must be admin, A, B, or C`);
                                    return;
                                }

                                users.push({ username, password, user_type: userType });
                            } catch (error) {
                                errors.push(`Row ${index + 2}: ${error.message}`);
                            }
                        });

                        if (errors.length > 0) {
                            const errorMsg = errors.slice(0, 5).join('; ');
                            const moreErrors = errors.length > 5 ? ` ... and ${errors.length - 5} more errors` : '';
                            showResult('uploadTestResult', `❌ Validation errors: ${errorMsg}${moreErrors}`, 'error');
                            return;
                        }

                        // Test API call
                        const response = await fetch('/api/users/bulk', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ users })
                        });

                        if (response.ok) {
                            const result = await response.json();
                            if (result.success) {
                                showResult('uploadTestResult', 
                                    `✅ Upload successful!<br>
                                     Created: ${result.successCount} users<br>
                                     Errors: ${result.errorCount} users<br>
                                     ${result.errors.length > 0 ? 'Error details: ' + result.errors.slice(0, 3).join('; ') : ''}`, 
                                    'success');
                            } else {
                                showResult('uploadTestResult', '❌ Upload failed: ' + (result.message || 'Unknown error'), 'error');
                            }
                        } else {
                            const error = await response.json();
                            showResult('uploadTestResult', '❌ API error: ' + (error.message || 'Unknown error'), 'error');
                        }

                    } catch (error) {
                        showResult('uploadTestResult', '❌ Error processing file: ' + error.message, 'error');
                    }
                };
                reader.readAsArrayBuffer(file);
            } catch (error) {
                showResult('uploadTestResult', '❌ Error: ' + error.message, 'error');
            }
        }

        function createSampleExcel() {
            try {
                // Create sample data
                const sampleData = [
                    { username: 'testuser1', password: 'password123', user_type: 'admin' },
                    { username: 'testuser2', password: 'password456', user_type: 'a' },
                    { username: 'testuser3', password: 'password789', user_type: 'b' }
                ];

                // Create workbook
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(sampleData);
                XLSX.utils.book_append_sheet(wb, ws, 'Users');

                // Generate and download file
                XLSX.writeFile(wb, 'sample_users.xlsx');
                showResult('sampleResult', '✅ Sample Excel file created and downloaded as "sample_users.xlsx"', 'success');
            } catch (error) {
                showResult('sampleResult', '❌ Error creating sample file: ' + error.message, 'error');
            }
        }

        // Auto-test XLSX library on page load
        window.onload = function() {
            testXLSXLibrary();
        };
    </script>
</body>
</html>
